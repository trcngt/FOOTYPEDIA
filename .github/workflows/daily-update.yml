---
import StarlightPage from '@astrojs/starlight/components/StarlightPage.astro';

// Tự động nạp toàn bộ file JSON có trong thư mục src/data/leagues/
const leagueFiles = import.meta.glob('../../data/leagues/*.json', { eager: true });
const allLeagues = Object.values(leagueFiles).map((file: any) => file.default || file);

const allTeams = allLeagues.flatMap((l) => l.teams || []);

// Cấu trúc Sidebar chuẩn cho Starlight
const dynamicSidebar = allLeagues.map((l) => ({
  label: l.leagueName,
  items: (l.teams || []).map((t: any) => ({
    label: t.name,
    link: `/cauthu/danhsach?team=${t.id}`,
  })),
}));
---

<StarlightPage 
  frontmatter={{ 
    title: 'Hồ Sơ Cầu Thủ & Chỉ Số Trực Tuyến', 
    description: 'Danh bạ thông số cầu thủ cập nhật hàng ngày' 
  }}
  sidebar={dynamicSidebar}
>
  <div style="margin-bottom: 1.5rem; border-bottom: 1px solid var(--sl-color-gray-5); padding-bottom: 0.8rem;">
    <h2 id="team-heading" style="margin: 0; font-size: 1.6rem;">Đang tải...</h2>
    <p style="margin: 4px 0 0 0; color: var(--sl-color-gray-3); font-size: 0.85rem;">🔄 Tự động cập nhật chỉ số (bàn thắng, kiến tạo, tuổi) hàng ngày</p>
  </div>

  <div id="players-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem;"></div>
</StarlightPage>

<script define:vars={{ allTeams }}>
  function renderView() {
    const teamId = new URLSearchParams(window.location.search).get('team') || '50';
    const currentTeam = allTeams.find((t) => String(t.id) === String(teamId)) || allTeams[0];

    const heading = document.getElementById('team-heading');
    const container = document.getElementById('players-grid');

    if (!currentTeam || !container) return;
    if (heading) heading.textContent = `Đội Hình: ${currentTeam.name}`;

    if (!currentTeam.players || currentTeam.players.length === 0) {
      container.innerHTML = '<p style="color: var(--sl-color-gray-3);">Chưa có dữ liệu cập nhật cho đội bóng này.</p>';
      return;
    }

    container.innerHTML = currentTeam.players
      .map(
        (p) => `
        <div style="background: var(--sl-color-gray-6); border: 1px solid var(--sl-color-gray-5); border-radius: 12px; padding: 1.2rem; display: flex; flex-direction: column; justify-content: space-between;">
          <div style="display: flex; gap: 14px; align-items: center; margin-bottom: 12px;">
            <img src="${p.photo}" alt="${p.name}" style="width: 58px; height: 58px; border-radius: 50%; object-fit: cover; border: 2px solid var(--sl-color-gray-5);" />
            <div>
              <h4 style="margin: 0; font-size: 1.05rem; color: var(--sl-color-white);">${p.name}</h4>
              <p style="margin: 2px 0 0 0; font-size: 0.85rem; font-weight: bold; color: var(--sl-color-text-accent);">${p.position}</p>
              <p style="margin: 2px 0 0 0; font-size: 0.8rem; color: var(--sl-color-gray-2);">${p.age || 'N/A'} tuổi • ${p.nationality}</p>
            </div>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 0.85rem; border-top: 1px solid var(--sl-color-gray-5); padding-top: 8px;">
            <span>⚽ Bàn: <strong>${p.goals}</strong></span>
            <span>🎯 Kiến tạo: <strong>${p.assists}</strong></span>
            <span>⏱ Ra sân: <strong>${p.appearences}</strong></span>
            <span>🟨 Thẻ vàng: <strong>${p.yellowCards}</strong></span>
          </div>
        </div>
      `
      )
      .join('');
  }

  renderView();
  window.addEventListener('popstate', renderView);
</script>